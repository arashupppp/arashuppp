<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ماکاپ پنل ویرایش پله</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:Tahoma; }
  body { background:#101418; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .stage { position:relative; width:900px; height:560px; background:#181818; border-radius:14px; overflow:hidden; }
  /* پس‌زمینهٔ شبیه‌سازی بوم ادیتور */
  .fake-canvas { position:absolute; inset:0; background:
    linear-gradient(#2e2e2e 1px, transparent 1px),
    linear-gradient(90deg, #2e2e2e 1px, transparent 1px);
    background-size:60px 60px; opacity:.35; }
  .panel { position:absolute; top:70px; left:50%; transform:translateX(-50%);
    background:#111; border:1px solid #00ffcc66; border-radius:12px;
    padding:14px 18px; color:#ddd; font-size:13px; box-shadow:0 10px 40px #000d; min-width:340px; }
  .title { color:#00ffcc; font-weight:bold; margin-bottom:12px; }
  .row { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .tbtn { padding:7px 10px; border-radius:8px; border:1px solid #345; background:#1a1a1a; color:#ccc; cursor:pointer; font-size:12px; }
  .tbtn.on { background:#00ffcc33; color:#00ffcc; border-color:#00ffcc; }
  .lbl { display:block; margin-bottom:4px; color:#9ab; font-size:12px; }
  .field { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .field input { width:78px; background:#000; border:1px solid #345; color:#fff; padding:5px 8px; border-radius:6px; font-size:13px; }
  .field .unit { color:#789; font-size:11px; }
  .hintbox { background:#0b1216; border:1px dashed #234; border-radius:8px; padding:7px 10px; font-size:11px; color:#7a8a95; margin:4px 0 12px; line-height:1.9; }
  .btns { display:flex; gap:8px; justify-content:flex-start; }
  .ok { padding:7px 22px; border-radius:8px; border:1px solid #00ffcc; background:#00ffcc22; color:#00ffcc; cursor:pointer; font-size:13px; }
  .cx { padding:7px 14px; border-radius:8px; border:1px solid #345; background:#1a1a1a; color:#999; cursor:pointer; font-size:13px; }
  .swbtn { padding:5px 12px; border-radius:6px; border:1px solid #345; background:#1a1a1a; color:#ccc; cursor:pointer; font-size:12px; }
  .cap { position:absolute; bottom:10px; right:14px; color:#556; font-size:10px; }
</style>
</head>
<body>
<div class="stage">
  <div class="fake-canvas"></div>
  <div class="panel">
    <div class="title">ویرایش پله</div>

    <span class="lbl">نوع پله</span>
    <div class="row">
      <button class="tbtn on">🪜 مستقیم</button>
      <button class="tbtn">↱ دربست L</button>
      <button class="tbtn">↷ دربست U</button>
      <button class="tbtn">↴ دربست J</button>
      <button class="tbtn">◉ مارپیچ</button>
    </div>

    <div class="field">
      <label>عرض: <input type="number" step="0.05" value="1.00"> <span class="unit">متر</span></label>
      <label>ارتفاع: <input type="number" step="0.1" value="2.80"> <span class="unit">متر</span></label>
    </div>

    <div class="field">
      <label>جهت صعود: <button class="swbtn">رو به جلو ↗</button></label>
      <label>چرخش: <button class="swbtn">۰°</button></label>
    </div>

    <div class="hintbox">
      ⓘ تغییر نوع → هندسهٔ سه‌نقطه‌ای از همان نقاط فعلی استفاده می‌کند<br>
      ⓘ مارپیچ: قطر = ۲×شعاع، جهت چرخش با R عوض می‌شود
    </div>

    <div class="btns">
      <button class="ok">تأیید</button>
      <button class="cx">بستن</button>
    </div>
  </div>
  <div class="cap">ماکاپ — پنل ویرایش پله (جایگزین popupها)</div>
</div>
</body>
</html>
